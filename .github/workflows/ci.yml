name: ci

# pnpm verify on every pull request and on master. A tag v<version> publishes
# every package whose version equals it to GitHub Packages (npm.pkg.github.com),
# with the GITHUB_TOKEN of this run: no personal token anywhere.

on:
    pull_request:
    push:
        branches: [master]
        tags: ["v*"]

permissions: {}

defaults:
    run:
        shell: bash

jobs:
    verify:
        # The required check of the master ruleset.
        name: ci / verify
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  cache: true

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm verify

    publish:
        name: publish
        needs: verify
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            # User-level config: pnpm ignores credentials with variables in a repository's .npmrc.
            - name: Registry credentials
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  umask 077
                  printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$HOME/.npmrc"

            - name: Install and build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            # The tag names the version: a package with another version is not published.
            - name: Publish
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version=${TAG#v}
                  for dir in auth contracts; do
                    current=$(node -p "require('./$dir/package.json').version")
                    if [ "$current" != "$version" ]; then
                      echo "$dir is $current, not $version: skipped"
                      continue
                    fi
                    (cd "$dir" && pnpm publish --no-git-checks)
                  done
